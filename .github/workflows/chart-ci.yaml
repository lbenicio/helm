name: Chart CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".ct.yml"
      - "Makefile"
      - "charts/**"
      - ".github/workflows/chart-ci.yaml"

permissions: {}

jobs:
  validate:
    name: Lint and test Helm charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Lint changed charts
        run: ct lint --target-branch main

      - name: Install Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.2.0 --verify=false

      - name: Run Helm unit tests
        run: make test
