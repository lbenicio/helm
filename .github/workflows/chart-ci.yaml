name: Chart CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".ct.yml"
      - "Makefile"
      - "charts/**"
      - ".github/workflows/chart-ci.yaml"
  push:
    branches: [main]
    paths:
      - ".ct.yml"
      - "Makefile"
      - "charts/**"
      - ".github/workflows/chart-ci.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Lint and test Helm charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Lint changed charts
        run: ct lint --target-branch main

      - name: Install Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.3.0 --verify=false

      - name: Run Helm unit tests and collect coverage
        run: make coverage

      - name: Preserve coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-coverage
          path: coverage/helm.lcov
          retention-days: 1

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Helm chart checks"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Chart lint and unit tests | **${JOB_STATUS}** |"
            echo "| Helm version | $(helm version --short) |"
            echo "| Test suite files | $(find charts -type f -path '*/tests/*_test.yaml' | wc -l | tr -d ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"

  codecov:
    name: Upload template coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-coverage
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/helm.lcov
          flags: helm
          fail_ci_if_error: true
          use_oidc: true
