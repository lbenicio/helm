name: Release Charts to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "landingpage/**"
      - ".github/workflows/release-charts.yaml"
      - "wrangler.toml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://helm.lbenicio.dev/
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Package charts and build repository
        run: make package

      - name: Validate repository index
        run: test -s public/index.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; fi
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🚀 Helm repository on Cloudflare Workers"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            printf '| Branch | %s |\n' "$BRANCH_NAME"
            printf '| Commit | %s |\n' "$COMMIT_SHA"
            printf '| Status | %s |\n' "$JOB_STATUS"
            echo "| URL | https://helm.lbenicio.dev/ |"
          } >> "$GITHUB_STEP_SUMMARY"
