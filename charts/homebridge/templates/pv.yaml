{{- if and .Values.persistence.enabled .Values.persistence.localPV.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.persistence.localPV.name | default (.Values.persistence.claimName | default (printf "%s-data" (include "homebridge.fullname" .))) }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "homebridge.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    - {{ .Values.persistence.accessMode }}
  persistentVolumeReclaimPolicy: {{ .Values.persistence.reclaimPolicy }}
  storageClassName: {{ .Values.persistence.storageClass }}
  local:
    path: {{ .Values.persistence.localPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.persistence.nodeAffinityHost }}
{{- end }}
