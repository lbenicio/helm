{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName | default (printf "%s-data" (include "homebridge.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homebridge.labels" . | nindent 4 }}
  {{- if .Values.persistence.retainOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  storageClassName: {{ .Values.persistence.storageClass }}
  volumeMode: Filesystem
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.localPV.enabled }}
  volumeName: {{ .Values.persistence.localPV.name | default (.Values.persistence.claimName | default (printf "%s-data" (include "homebridge.fullname" .))) }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
