suite: homebridge deployment
templates:
  - deploy.yaml
  - hpa.yaml
  - pvc.yaml
  - pv.yaml
  - recovery-pvc.yaml
  - recovery-pv.yaml
tests:
  - it: should be a StatefulSet
    asserts:
      - isKind:
          of: StatefulSet
        template: deploy.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: deploy.yaml
  - it: should set image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^homebridge/homebridge:"
        template: deploy.yaml
  - it: should have resources configured
    asserts:
      - exists:
          path: spec.template.spec.containers[0].resources.requests.cpu
        template: deploy.yaml
      - exists:
          path: spec.template.spec.containers[0].resources.limits.memory
        template: deploy.yaml
  - it: should not render HPA when autoscaling disabled
    set:
      autoscaling:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: hpa.yaml
  - it: should render HPA when autoscaling enabled
    set:
      autoscaling:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: hpa.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: hpa.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
        template: hpa.yaml
  - it: should have data volume mount
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /homebridge
        template: deploy.yaml
      - equal:
          path: spec.template.spec.volumes[0].name
          value: data
        template: deploy.yaml
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
        template: deploy.yaml
  - it: should create PVC when persistence enabled and no existingClaim
    set:
      persistence:
        enabled: true
        existingClaim: ""
        localPV:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
        template: pvc.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: pvc.yaml
      - equal:
          path: spec.storageClassName
          value: local-storage
        template: pvc.yaml
      - hasDocuments:
          count: 0
        template: pv.yaml
  - it: should consume an existing NFS claim without creating chart storage resources
    set:
      persistence:
        enabled: true
        existingClaim: homebridge-data-ntfs
        storageClass: ntfs-storage
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: homebridge-data-ntfs
        template: deploy.yaml
      - hasDocuments:
          count: 0
        template: pvc.yaml
      - hasDocuments:
          count: 0
        template: pv.yaml
  - it: should create an NFS PVC without a local PV
    set:
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ntfs-storage
        localPV:
          enabled: false
    asserts:
      - equal:
          path: spec.storageClassName
          value: ntfs-storage
        template: pvc.yaml
      - hasDocuments:
          count: 0
        template: pv.yaml
  - it: should create a named NFS PVC and mount it from the StatefulSet
    set:
      persistence:
        enabled: true
        existingClaim: ""
        claimName: homebridge-data-ntfs
        storageClass: ntfs-storage
        size: 10Gi
        accessMode: ReadWriteOnce
        retainOnUninstall: true
    asserts:
      - equal:
          path: metadata.name
          value: homebridge-data-ntfs
        template: pvc.yaml
      - equal:
          path: spec.storageClassName
          value: ntfs-storage
        template: pvc.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: homebridge-data-ntfs
        template: deploy.yaml
  - it: should manage an optional recovery PV and PVC without mounting either
    set:
      persistence:
        recoveryVolume:
          enabled: true
          pvName: homebridge-data-local-backup
          claimName: homebridge-data-local-backup
          storageClass: local-storage
          size: 10Gi
          accessMode: ReadWriteOnce
          reclaimPolicy: Retain
          localPath: /var/local/k8s/homebridge
          nodeAffinityHost: lbenicio-rpi4-slave1
    asserts:
      - equal:
          path: spec.local.path
          value: /var/local/k8s/homebridge
        template: recovery-pv.yaml
      - equal:
          path: spec.claimRef.name
          value: homebridge-data-local-backup
        template: recovery-pv.yaml
      - equal:
          path: spec.volumeName
          value: homebridge-data-local-backup
        template: recovery-pvc.yaml
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
        template: deploy.yaml
  - it: should create a static local PV only when explicitly enabled
    set:
      persistence:
        enabled: true
        existingClaim: ""
        localPV:
          enabled: true
        nodeAffinityHost: node1
    asserts:
      - isKind:
          of: PersistentVolume
        template: pv.yaml
      - equal:
          path: spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: node1
        template: pv.yaml
  - it: should use an empty directory when persistence is disabled and no claim is supplied
    set:
      persistence:
        enabled: false
        existingClaim: ""
    asserts:
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
        template: deploy.yaml
  - it: should not create PVC when persistence disabled
    set:
      persistence:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: pvc.yaml
