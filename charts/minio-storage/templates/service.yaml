---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  annotations:
    metallb.io/address-pool: storage-services-pool
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.0.239
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
