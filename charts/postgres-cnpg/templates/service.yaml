---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    metallb.io/address-pool: storage-services-pool
spec:
  type: LoadBalancer
  clusterIP: {{ .Values.service.clusterIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  selector:
    cnpg.io/cluster: postgres-cnpg
    role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
