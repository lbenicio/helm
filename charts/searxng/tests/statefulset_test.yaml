suite: searxng statefulset
templates:
  - statefulset.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
tests:
  - it: should be a StatefulSet
    asserts:
      - isKind:
          of: StatefulSet
        template: statefulset.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: statefulset.yaml
  - it: should use a single data volumeClaimTemplate
    asserts:
      - exists:
          path: spec.volumeClaimTemplates
        template: statefulset.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
        template: statefulset.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: local-path
        template: statefulset.yaml
  - it: should mount config and cache from the same volume
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: data
            mountPath: /etc/searxng
            subPath: config
        template: statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: data
            mountPath: /var/cache/searxng
            subPath: cache
        template: statefulset.yaml
  - it: should run as uid/gid 977
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 977
        template: statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 977
        template: statefulset.yaml
  - it: should respect node scheduling settings
    set:
      nodeSelector:
        kubernetes.io/hostname: node1
      tolerations:
        - key: dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/hostname: node1
        template: statefulset.yaml
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
        template: statefulset.yaml
  - it: should use existingClaim instead of volumeClaimTemplates
    set:
      persistence:
        existingClaim: my-claim
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset.yaml
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: my-claim
        template: statefulset.yaml
  - it: should apply an NFS class to chart-managed PVCs
    set:
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ntfs-storage
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: ntfs-storage
        template: statefulset.yaml
  - it: should create a named NFS PVC and mount it from the StatefulSet
    set:
      persistence:
        enabled: true
        existingClaim: ""
        claimName: searxng-nfs-3gi
        storageClass: ntfs-storage
        accessMode: ReadWriteMany
        size: 3Gi
        retainOnDelete: true
    asserts:
      - equal:
          path: metadata.name
          value: searxng-nfs-3gi
        template: pvc.yaml
      - equal:
          path: spec.storageClassName
          value: ntfs-storage
        template: pvc.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteMany
        template: pvc.yaml
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: searxng-nfs-3gi
        template: statefulset.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset.yaml
  - it: should mount an empty directory when persistence is disabled
    set:
      persistence:
        enabled: false
        existingClaim: ""
    asserts:
      - exists:
          path: spec.template.spec.volumes[1].emptyDir
        template: statefulset.yaml
  - it: should render settings.yml ConfigMap
    asserts:
      - isKind:
          of: ConfigMap
        template: configmap.yaml
      - matchRegex:
          path: metadata.name
          pattern: ".*-config$"
        template: configmap.yaml
  - it: should create a Secret with SEARXNG_SECRET
    asserts:
      - isKind:
          of: Secret
        template: secret.yaml
      - exists:
          path: data.SEARXNG_SECRET
        template: secret.yaml
  - it: should not create a Secret when existingSecret is set
    set:
      secret:
        existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
        template: secret.yaml
