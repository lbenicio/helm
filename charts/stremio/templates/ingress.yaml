{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stremio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stremio.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
        {{- range .paths }}
          {{- $service := default "client" .service }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq $service "server" }}
                name: {{ include "stremio.server.fullname" $ }}
                port:
                  number: {{ $.Values.server.httpPort }}
                {{- else if eq $service "client" }}
                name: {{ include "stremio.client.fullname" $ }}
                port:
                  number: {{ $.Values.client.port }}
                {{- else }}
                {{- fail (printf "unsupported ingress service %q; expected client or server" $service) }}
                {{- end }}
        {{- end }}
  {{- end }}
{{- end }}
