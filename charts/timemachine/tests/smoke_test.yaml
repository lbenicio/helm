suite: timemachine smoke tests
templates:
  - serviceaccount.yaml
  - statefulset.yaml
  - pv.yaml
  - pvc.yaml
  - storageclass.yaml
tests:
  - it: renders the service account
    asserts:
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
  - it: mounts a supplied claim and skips volumeClaimTemplates
    set:
      persistence:
        enabled: true
        existingClaim: tm01-disk
        storageClass: storage-local
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: tm01-disk
        template: statefulset.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset.yaml
  - it: applies the configured storage class to chart-managed claims
    set:
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: storage-local
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: storage-local
        template: statefulset.yaml
  - it: renders a named static local PV and PVC for Helm ownership
    set:
      persistence:
        enabled: true
        existingClaim: ""
        claimName: tm01-disk
        storageClass: storage-local
        size: 3Ti
        accessMode: ReadWriteOnce
        retainOnDelete: true
        staticLocalPV:
          enabled: true
          name: tm01-local
          localPath: /mnt/disk1/tm
          nodeAffinityHost: lbenicio-rpi4-storage1
      storageClass:
        create: true
        name: storage-local
    asserts:
      - equal:
          path: metadata.name
          value: tm01-local
        template: pv.yaml
      - equal:
          path: spec.local.path
          value: /mnt/disk1/tm
        template: pv.yaml
      - equal:
          path: spec.claimRef.name
          value: tm01-disk
        template: pv.yaml
      - equal:
          path: metadata.name
          value: tm01-disk
        template: pvc.yaml
      - equal:
          path: spec.volumeName
          value: tm01-local
        template: pvc.yaml
      - equal:
          path: metadata.name
          value: storage-local
        template: storageclass.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: tm01-disk
        template: statefulset.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset.yaml
  - it: renders no shared StorageClass unless explicitly enabled
    asserts:
      - hasDocuments:
          count: 0
        template: storageclass.yaml
  - it: mounts an empty directory when persistence is disabled
    set:
      persistence:
        enabled: false
        existingClaim: ""
    asserts:
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
        template: statefulset.yaml
