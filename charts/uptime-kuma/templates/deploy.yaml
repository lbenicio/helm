{{- if .Values.customCA.enabled }}
  {{- if and .Values.customCA.configMap.name .Values.customCA.secret.name }}
    {{- fail "customCA accepts either configMap.name or secret.name, not both" }}
  {{- else if not (or .Values.customCA.configMap.name .Values.customCA.secret.name) }}
    {{- fail "customCA.enabled requires customCA.configMap.name or customCA.secret.name" }}
  {{- end }}
  {{- if and .Values.customCA.configMap.create (not .Values.customCA.configMap.name) }}
    {{- fail "customCA.configMap.create requires customCA.configMap.name" }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-kuma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uptime-kuma.labels" . | nindent 4 }}
  {{- if .Values.keel.enabled }}
  annotations:
    keel.sh/policy: {{ .Values.keel.policy | quote }}
    keel.sh/trigger: {{ .Values.keel.trigger | quote }}
    keel.sh/pollSchedule: {{ .Values.keel.pollSchedule | quote }}
    keel.sh/match-tag: {{ .Values.keel.matchTag | quote }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uptime-kuma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime-kuma.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.keel.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.keel.enabled }}
        keel.sh/policy: {{ .Values.keel.policy | quote }}
        keel.sh/trigger: {{ .Values.keel.trigger | quote }}
        keel.sh/pollSchedule: {{ .Values.keel.pollSchedule | quote }}
        keel.sh/match-tag: {{ .Values.keel.matchTag | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "uptime-kuma.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if or .Values.env .Values.extraEnv .Values.customCA.enabled }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            {{- if .Values.customCA.enabled }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ .Values.customCA.mountPath | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.externalDatabase.enabled }}
            - name: db-config
              mountPath: {{ .Values.persistence.mountPath }}/db-config.json
              subPath: db-config.json
            {{- end }}
            - name: ca-cert
              mountPath: /etc/ssl/certs/my-selfsigned-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- if .Values.customCA.enabled }}
            - name: custom-ca
              mountPath: {{ .Values.customCA.mountPath }}
              subPath: custom-ca.pem
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "uptime-kuma.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.externalDatabase.enabled }}
        - name: db-config
          secret:
            secretName: {{ include "uptime-kuma.fullname" . }}-db
        {{- end }}
        - name: ca-cert
          secret:
            secretName: root-secret
            items:
              - key: ca.crt
                path: ca.crt
        {{- if .Values.customCA.enabled }}
        - name: custom-ca
          {{- if .Values.customCA.configMap.name }}
          configMap:
            name: {{ .Values.customCA.configMap.name }}
            items:
              - key: {{ .Values.customCA.configMap.key }}
                path: custom-ca.pem
          {{- else }}
          secret:
            secretName: {{ .Values.customCA.secret.name }}
            items:
              - key: {{ .Values.customCA.secret.key }}
                path: custom-ca.pem
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
