suite: uptime-kuma custom CA
templates:
  - deploy.yaml
  - custom-ca-configmap.yaml
tests:
  - it: mounts a ConfigMap CA and configures Node.js trust
    set:
      customCA:
        enabled: true
        configMap:
          name: uptimekuma-ca
          key: ca.pem
        mountPath: /etc/uptime-kuma/ca.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/uptime-kuma/ca.pem
        template: deploy.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca
            mountPath: /etc/uptime-kuma/ca.pem
            subPath: custom-ca.pem
            readOnly: true
        template: deploy.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: uptimekuma-ca
              items:
                - key: ca.pem
                  path: custom-ca.pem
        template: deploy.yaml
  - it: mounts a Secret CA source
    set:
      customCA:
        enabled: true
        configMap:
          name: ""
        secret:
          name: custom-ca-secret
          key: ca.crt
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            secret:
              secretName: custom-ca-secret
              items:
                - key: ca.crt
                  path: custom-ca.pem
        template: deploy.yaml
  - it: creates the CA ConfigMap from supplied PEM content
    set:
      customCA:
        enabled: true
        configMap:
          create: true
          name: uptimekuma-ca
          key: certificate
          content: test-ca-bundle
    asserts:
      - isKind:
          of: ConfigMap
        template: custom-ca-configmap.yaml
      - equal:
          path: metadata.name
          value: uptimekuma-ca
        template: custom-ca-configmap.yaml
      - equal:
          path: data.certificate
          value: test-ca-bundle
        template: custom-ca-configmap.yaml
